name: default

on:
  push:
    branches: [ main, devel ]
  pull_request:
    branches: [ main, devel ]

env:
  BUILD_TYPE: Release

jobs:
  boundary-check:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Library must not depend on sample code
      shell: bash
      run: |
        # The library (src/) is visualization-only. Editor / app-level code
        # lives in sample/ and depends on src/, never the other way around.
        if grep -RIn --include='*.hpp' --include='*.cpp' --include='*.h' --include='*.cc' \
            -e '#include[[:space:]]*[<"]sample/' \
            -e '#include[[:space:]]*[<"]\.\./\.\./sample/' \
            src/; then
          echo "::error::src/ must not include from sample/. See CLAUDE.md."
          exit 1
        fi
        if grep -RIn 'add_subdirectory[[:space:]]*([[:space:]]*\.\./sample' src/ ; then
          echo "::error::src/ CMake must not pull in sample/ subdirectories."
          exit 1
        fi
        echo "Library boundary OK."

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-22.04, ubuntu-24.04 ]
    steps:
    - uses: actions/checkout@v4
    - name: Checkout submodules
      run: git submodule update --init --recursive
    - name: Install Dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev \
          libglfw3-dev libcairo2-dev libopencv-dev libglm-dev libncurses-dev \
          valgrind libbenchmark-dev lcov
    - name: Create Build Environment
      run: cmake -E make_directory ${{runner.workspace}}/build
    - name: Configure CMake (Ubuntu 20.04)
      if: ${{ matrix.os == 'ubuntu-20.04' }}
      shell: bash
      working-directory: ${{runner.workspace}}/build
      run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DENABLE_AUTO_LAYOUT=OFF -DBUILD_TESTING=ON
    - name: Configure CMake (Ubuntu 22.04 or 24.04)
      if: ${{ matrix.os == 'ubuntu-22.04' || matrix.os == 'ubuntu-24.04' }}
      shell: bash
      working-directory: ${{runner.workspace}}/build
      run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DBUILD_TESTING=ON
    - name: Build
      working-directory: ${{runner.workspace}}/build
      shell: bash
      run: cmake --build . --config $BUILD_TYPE && cpack
    - name: Test
      working-directory: ${{runner.workspace}}/build
      shell: bash
      run: |
        # Run tests with verbose output and XML reporting
        export VALGRIND_OPTS="--suppressions=$GITHUB_WORKSPACE/tests/valgrind.supp"
        ctest -C $BUILD_TYPE --verbose --output-on-failure --output-junit test_results.xml
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.os }}
        path: ${{runner.workspace}}/build/test_results.xml

  # macOS coverage: AppleClang + libc++ on arm64. The GL usage is already
  # portable (a 3.2 core + forward-compatible context on Apple, #version 330
  # shaders, under the 4.1 cap macOS enforces); this lane keeps it that way.
  # The GUI itself is not exercised -- the samples need a display.
  #
  # KNOWN FAILURE: PCLLoaderTest.InvalidFileError. PCL 1.15 (what Homebrew
  # ships) parses a garbage .pcd into a zero-point cloud and returns success,
  # so LoadPCDInternal's `== -1` check never fires and no CorruptedFileException
  # is thrown. This is a loader robustness gap rather than a platform issue and
  # will reach the Ubuntu lanes when they move past PCL 1.14.
  macos:
    name: macOS (arm64)
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4
    - name: Checkout submodules
      run: git submodule update --init --recursive
    - name: Install Dependencies
      # eigen@3 and opencv@4 are keg-only: Homebrew defaults to Eigen 5 and
      # OpenCV 5, and this project targets the 3.x/4.x APIs.
      run: brew install glfw cairo fontconfig glm opencv@4 pcl eigen@3 abseil re2 ncurses
    - name: Configure CMake
      shell: bash
      run: >
        cmake -S . -B build -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DBUILD_TESTING=ON
        -DCMAKE_PREFIX_PATH="$(brew --prefix eigen@3);$(brew --prefix opencv@4)"
    - name: Build
      shell: bash
      run: cmake --build build -j"$(sysctl -n hw.ncpu)" --config $BUILD_TYPE
    - name: Test
      working-directory: build
      shell: bash
      run: ctest -C $BUILD_TYPE --output-on-failure

  minimal-build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-22.04, ubuntu-24.04 ]
    steps:
    - uses: actions/checkout@v4
    - name: Checkout submodules
      run: git submodule update --init --recursive
    - name: Install Dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev \
          libglfw3-dev libglm-dev libcairo2-dev valgrind
    - name: Create Build Environment
      run: cmake -E make_directory ${{runner.workspace}}/build
    - name: Configure CMake (Ubuntu 20.04)
      if: ${{ matrix.os == 'ubuntu-20.04' }}
      shell: bash
      working-directory: ${{runner.workspace}}/build
      run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DENABLE_AUTO_LAYOUT=OFF -DBUILD_TESTING=ON
    - name: Configure CMake (Ubuntu 22.04 or 24.04)
      if: ${{ matrix.os == 'ubuntu-22.04' || matrix.os == 'ubuntu-24.04' }}
      shell: bash
      working-directory: ${{runner.workspace}}/build
      run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DBUILD_TESTING=ON
    - name: Build
      working-directory: ${{runner.workspace}}/build
      shell: bash
      run: cmake --build . --config $BUILD_TYPE && cpack
    - name: Test
      working-directory: ${{runner.workspace}}/build
      shell: bash
      run: |
        # Run tests with verbose output and XML reporting
        export VALGRIND_OPTS="--suppressions=$GITHUB_WORKSPACE/tests/valgrind.supp"
        ctest -C $BUILD_TYPE --verbose --output-on-failure --output-junit test_results_minimal.xml
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-minimal-${{ matrix.os }}
        path: ${{runner.workspace}}/build/test_results_minimal.xml
